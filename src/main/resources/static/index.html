<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Java AI Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #messages {
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height: 400px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .user {
            font-weight: bold;
        }

        .assistant {
            color: #333;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Java AI Chat</h1>

<div id="messages"></div>

<div class="input-area">
    <input
            id="messageInput"
            type="text"
            placeholder="输入你的问题..."
            onkeydown="handleInputKeydown(event)"
    />

    <button onclick="sendMessage()">
        发送
    </button>
</div>

<script>
    const conversationId = crypto.randomUUID();
    let currentAbortController = null;

    function handleInputKeydown(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {

        const input = document.getElementById("messageInput");
        const message = input.value.trim();

        if (!message) {
            return;
        }

        input.value = "";

        appendMessage("用户", message, "user");

        const assistantElement =
            appendMessage("AI", "", "assistant");

        if (currentAbortController) {
            currentAbortController.abort();
        }

        const abortController = new AbortController();
        currentAbortController = abortController;

        try {
            const response = await fetch("/api/chat/with_system", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "text/event-stream"
                },
                body: JSON.stringify({
                    message,
                    conversationId
                }),
                signal: abortController.signal
            });

            if (!response.ok || !response.body) {
                throw new Error(`请求失败：${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

                const events = buffer.split(/\r?\n\r?\n/);
                buffer = events.pop();

                for (const event of events) {
                    const content = event
                        .split(/\r?\n/)
                        .filter(line => line.startsWith("data:"))
                        .map(line => line.slice(5).trimStart())
                        .join("\n");

                    assistantElement.textContent += content;
                }

                if (done) {
                    break;
                }
            }
        } catch (error) {
            if (error.name !== "AbortError") {
                console.error("chatWithSystem 请求失败:", error);
                assistantElement.textContent = "请求失败，请稍后重试。";
            }
        } finally {
            if (currentAbortController === abortController) {
                currentAbortController = null;
            }
        }
    }

    function appendMessage(role, content, className) {

        const messages =
            document.getElementById("messages");

        const element =
            document.createElement("div");

        element.className =
            "message " + className;

        element.innerHTML =
            "<strong>" + role + "：</strong><br>" +
            "<span class=\"content\"></span>";

        element.querySelector(".content").textContent =
            content;

        messages.appendChild(element);

        return element.querySelector(".content");
    }
</script>

</body>
</html>
